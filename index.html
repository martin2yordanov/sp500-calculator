<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets in styles.css actually receive values on notched iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Калкулатор за лихва върху лихва при инвестиция в индексен фонд върху S&P 500, с живи цени на SXR8." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- What iOS writes under the icon when the site is added to the home
         screen; the full title is too long and gets truncated there. -->
    <meta name="apple-mobile-web-app-title" content="S&P 500" />
    <title>S&P 500 Калкулатор</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- Home-screen bookmarks on iOS read this and ignore the manifest. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts move here from a runtime-injected @import: that pattern blocks render and
         re-parses on every mount. preconnect + a single stylesheet is measurably faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
