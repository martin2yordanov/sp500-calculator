<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Small-size variant of public/favicon.svg, used to rasterise 16/32/48px.

    Identical geometry and colour, with the glow removed. At those sizes the
    blur is imperceptible but still eats contrast at the line's edge, so
    dropping it buys sharpness for free. Simplifying the smallest sizes of an
    icon set is normal practice, not a shortcut.
  -->
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ee3b9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#5ee3b9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#0d0d0d"/>

  <path d="M140 690 L330 500 L470 610 L660 380 L884 250 L884 902 L140 902 Z"
        fill="url(#area)"/>

  <path d="M140 690 L330 500 L470 610 L660 380 L884 250"
        fill="none" stroke="#5ee3b9" stroke-width="78"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
